<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>3D Game Prototype</title>
  <style>
    html,body { height:100%; margin:0; overflow:hidden; }
    canvas { display:block; }
    /* simple on-screen hints for touch */
    #hint { position: absolute; bottom: 8px; left: 8px; color: white; font-family: sans-serif; background: rgba(0,0,0,0.3); padding:6px; border-radius:4px; }
  </style>
</head>
<body>
  <div id="hint">Tap left/right to move, tap top to jump</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.0/build/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
