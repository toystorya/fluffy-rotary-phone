<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <title>Pookie 3D - Prototype</title>
  <style>
    html,body { height:100%; margin:0; background:#88ccee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    #gameContainer { position:relative; width:100%; height:100%; overflow:hidden; touch-action: none; -webkit-user-select:none; user-select:none; }
    canvas { display:block; width:100%; height:100%; }
    #hint {
      position: absolute;
      left: 8px;
      bottom: 8px;
      padding: 6px 8px;
      background: rgba(0,0,0,0.35);
      color: #fff;
      border-radius: 6px;
      font-size: 13px;
      backdrop-filter: blur(4px);
    }
    /* optional visible mobile controls for clarity (you can hide later) */
    .touch-button {
      position:absolute;
      bottom:8px;
      width:34%;
      height:40%;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      touch-action: none;
    }
    #leftBtn { left:3%; }
    #rightBtn { right:3%; }
    #jumpBtn { left:33%; right:33%; bottom:calc(8px + 44%); height:22%; width:34%; }
    #fps { position:absolute; top:8px; right:8px; color:#fff; background:rgba(0,0,0,0.3); padding:6px 8px; border-radius:6px; font-size:12px; }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="hint">Tap left/right to move. Tap top to jump. (A/D, ←/→, Space on keyboard)</div>
    <!-- optional visual touch regions (useful on iPad). You can remove these if you prefer direct canvas touches -->
    <div id="leftBtn" class="touch-button" aria-hidden="true"></div>
    <div id="rightBtn" class="touch-button" aria-hidden="true"></div>
    <div id="jumpBtn" class="touch-button" aria-hidden="true"></div>
    <div id="fps">0 FPS</div>
  </div>

  <!-- non-module build of three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.0/build/three.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
